name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'homework-app/**'
      - '!homework-app/README.md'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homework-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm i -g bun
          bun install --frozen-lockfile

      - name: Generate native Android project (prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('homework-app/android/**/*.gradle*', 'homework-app/android/gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build release APK (debug signing, installable)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/homework-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: homework-android-apk
          path: homework-app/dist/homework-release.apk
          if-no-files-found: error

      - name: Attach to Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: homework-app/dist/homework-release.apk
